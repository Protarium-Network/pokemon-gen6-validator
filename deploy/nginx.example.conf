# The 3DS only speaks old TLS to these hosts; adjust protocols/ciphers to what your consoles need.
server {
	listen 443 ssl;
	server_name validator.example.org;

	ssl_protocols TLSv1.2;
	ssl_certificate     /etc/ssl/validator.example.org.crt;
	ssl_certificate_key /etc/ssl/validator.example.org.key;

	location / {
		proxy_pass http://127.0.0.1:9107;
		proxy_http_version 1.1;
	}
}
